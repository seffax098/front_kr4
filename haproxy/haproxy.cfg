global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  option httplog

frontend http_front
  bind *:80
  default_backend app_backends

frontend stats
  bind *:8404
  stats enable
  stats uri /
  stats refresh 5s
  stats show-legends

backend app_backends
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  server backend1 backend1:3000 check inter 2s fall 2 rise 2
  server backend2 backend2:3000 check inter 2s fall 2 rise 2
  server backend3 backend3:3000 check inter 2s fall 2 rise 2 backup
