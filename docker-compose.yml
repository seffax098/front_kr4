services:
  nginx:
    image: nginx:1.27-alpine
    container_name: unified-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html/ui:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    networks:
      - app-network

  backend1:
    build: ./backend
    container_name: unified-backend-1
    environment:
      PORT: 3000
      SERVER_ID: backend-1
      DATABASE_URL: postgres://app:app_password@postgres:5432/fullstack_sql
      MONGO_URI: mongodb://app:app_password@mongo:27017/fullstack_nosql?authSource=admin
      REDIS_URL: redis://redis:6379
      USERS_CACHE_TTL_SECONDS: 60
      PRODUCTS_CACHE_TTL_SECONDS: 600
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  backend2:
    build: ./backend
    container_name: unified-backend-2
    environment:
      PORT: 3000
      SERVER_ID: backend-2
      DATABASE_URL: postgres://app:app_password@postgres:5432/fullstack_sql
      MONGO_URI: mongodb://app:app_password@mongo:27017/fullstack_nosql?authSource=admin
      REDIS_URL: redis://redis:6379
      USERS_CACHE_TTL_SECONDS: 60
      PRODUCTS_CACHE_TTL_SECONDS: 600
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  backend3:
    build: ./backend
    container_name: unified-backend-3-backup
    environment:
      PORT: 3000
      SERVER_ID: backend-3-backup
      DATABASE_URL: postgres://app:app_password@postgres:5432/fullstack_sql
      MONGO_URI: mongodb://app:app_password@mongo:27017/fullstack_nosql?authSource=admin
      REDIS_URL: redis://redis:6379
      USERS_CACHE_TTL_SECONDS: 60
      PRODUCTS_CACHE_TTL_SECONDS: 600
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  postgres:
    image: postgres:17-alpine
    container_name: unified-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: fullstack_sql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fullstack_sql"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  mongo:
    image: mongo:7.0
    container_name: unified-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: app_password
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username app --password app_password --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: unified-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  app-network:
    driver: bridge
